services:
  workspace:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: workspace:latest

  testing:
    build:
      context: ./testing
      dockerfile: Dockerfile
    depends_on:
      - workspace
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.route_localnet: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - COPILOT_MODEL=${COPILOT_MODEL:-claude-sonnet-4.6}
      # Optional: forward localhost ports to host.docker.internal (e.g. local services, DynamoDB, Redis)
      # Comma-separated ports and/or dash ranges: "8000", "8000,5432", "9200-9300", "8000-8100,9500-9600"
      # Requires cap_add: [NET_ADMIN] and sysctls: net.ipv4.conf.all.route_localnet: 1 (already set above)
      # - HOST_DOCKER_DNAT_PORTS=${HOST_DOCKER_DNAT_PORTS}
      # Optional: override inference effort (e.g. low, medium, high)
      # - COPILOT_EFFORT=${COPILOT_EFFORT}
      # Optional: cap the autopilot continuation loop (default: 20)
      # - COPILOT_MAX_AUTOPILOT_CONTINUES=${COPILOT_MAX_AUTOPILOT_CONTINUES:-20}
      # Optional: comma-separated extra directories the agent can access.
      # Extends the defaults (workspace, workspace.worktrees, .copilot) — does not replace them.
      # - COPILOT_ADD_DIRS=${COPILOT_ADD_DIRS}
      # Optional: comma-separated deny-tool entries (unset = no deny tools)
      # - COPILOT_DENY_TOOLS=${COPILOT_DENY_TOOLS}
      # GitHub CLI (gh) auth: either mount ~/.config/gh (preferred) or set GH_TOKEN.
      # - GH_TOKEN=${GH_TOKEN}
    volumes:
      # Mount copilot logs:
      - ./logs/copilot:/var/log/copilot
      # Mount your workspace:
      - ./workspace:/root/workspace
      # Optional: mount host git config for correct git identity inside the container
      - ~/.gitconfig:/root/.gitconfig:ro
      # Optional: expose the host Docker socket so integration tests can manage containers.
      # WARNING: This grants full Docker daemon access (equivalent to root on the host).
      # Only enable for trusted developer workloads — never in production or untrusted CI.
      - /var/run/docker.sock:/var/run/docker.sock
      # Required for GitHub CLI (gh) authentication — mount host gh config
      - ~/.config/gh:/root/.config/gh:rw
      # Mount gh config for the dev user so `copilot plugin install` (run as dev) can authenticate
      - ~/.config/gh:/home/dev/.config/gh:ro
      # Run copilot plugin installs at startup (after init.d, before main command)
      - ./testing/setup.sh:/etc/sandbox/setup.sh:ro
